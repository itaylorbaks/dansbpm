name: Deploy to InfinityFree

on:
  push:
    branches:
      - main  # Change this to 'master' if your main branch uses the old naming convention

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: htdocs/    # This forces files to go into InfinityFree's public web folder. update. push again. again
        dangerous-clean-slate: false # Set to true ONLY if you want GitHub to delete old files on the server that aren't in your repo
