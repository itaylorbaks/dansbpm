name: Update Google Drive sound catalog

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh catalog and build app
        run: |
          python3 scripts/update-drive-sound-catalog.py
          node scripts/build-app.js

      - name: Commit catalog changes
        id: catalog
        run: |
          if git diff --quiet -- app/drive-sample-catalog.js app.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/drive-sample-catalog.js app.js
          git commit -m "Update Google Drive sound catalog" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated sound catalog
        if: steps.catalog.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: bpm.site.je/htdocs/
          dangerous-clean-slate: false
